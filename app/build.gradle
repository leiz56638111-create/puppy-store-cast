plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'cn.local.livingroomcast'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'cn.local.livingroomcast'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '1.0.1'
        testInstrumentationRunner project.findProperty('nativeRunner') ?: 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('signing/test.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.androidTest.java.srcDir rootProject.file('airplay/src/androidTest/java')
    sourceSets.androidTest.assets.srcDir rootProject.file('airplay/src/androidTest/assets')
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}

dependencies {
    implementation project(':airplay')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
}

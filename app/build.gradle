plugins { id 'com.android.application' }

android {
    namespace 'cn.local.livingroomcast'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.local.livingroomcast'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '0.1.7-test'
        testInstrumentationRunner project.findProperty('nativeRunner') ?: 'cn.local.livingroomcast.QualityInstrumentation'
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('signing/test.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'
}
